name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Shell compatibility
        run: bash scripts/check-shell-compat.sh

      - name: Validate documentation assets
        run: python3 scripts/check-doc-assets.py
